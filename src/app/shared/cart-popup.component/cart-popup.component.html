<div class="absolute right-0 top-full mt-1 w-[320px] sm:w-95 bg-white rounded-xl shadow-xl z-50">
    <div class="flex items-center justify-between p-4 border-b">
        <h3 class="font-semibold text-lg">Your Cart</h3>
        <button (click)="cartService.showCart = false" class="text-gray-400 hover:text-gray-700">
            ✕
        </button>
    </div>

    <div class="max-h-75 overflow-y-auto p-4 space-y-4">

        @if (cartItems$ | async; as items) {
        @if(items.length > 0){
        @for (item of items; track item.product.id) {
        <div class="flex gap-3">

            <div class="w-14 h-14 bg-gray-100 rounded flex items-center justify-center">
                1:1
            </div>

            <div class="flex-1">
                <p class="text-sm font-medium leading-snug">
                    {{ item.product.title }}
                </p>

                <div class="flex items-center justify-between mt-1">
                    <span class="text-sm text-gray-500">
                        {{ item.quantity }} × ${{ item.product.price }}
                    </span>

                    <button (click)="remove(item)" class="text-xs text-red-500 hover:underline">
                        Remove
                    </button>
                </div>
            </div>
        </div>
        }
        }@else {
        <p class="text-center text-gray-500 py-12">
            Your cart is empty
        </p>
        }
        }
    </div>

    @if (cartItems$ | async; as items) {
    <div class="border-t p-4">
        <div class="flex justify-between mb-3">
            <span class="font-medium">Total</span>
            <span class="font-semibold">
                ${{ getTotal(items) }}
            </span>
        </div>

        <button class="w-full bg-[#54d417] hover:bg-[#7ac64d]
               text-white py-2 rounded-lg">
            View Cart
        </button>
    </div>
    }
</div>
