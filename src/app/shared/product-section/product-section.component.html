<section class="mt-16">
    <div class="max-w-7xl mx-auto px-4 lg:px-8">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-xl font-semibold">{{ title }}</h2>

            <div class="hidden md:flex lg:flex items-center gap-6 text-sm">
                @for (tab of tabs; track $index) {
                <button (click)="onTabChange(tab.id)" class="relative pb-1"
                    [class.text-green-500]="activeTab === tab.id">
                    {{ tab.label }}

                    @if(activeTab === tab.id){
                    <span class="absolute left-0 -bottom-1 w-full h-0.5 bg-green-500">
                    </span>
                    }
                </button>
                }

                <div class="flex gap-2 ml-4">
                    <button class="w-3 h-3 flex items-center justify-center">
                        <i class="bi bi-chevron-left text-lg"></i>
                    </button>
                    <button class="w-3 h-3 flex items-center justify-center">
                        <i class="bi bi-chevron-right text-lg"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="sm:hidden">
            <div class="flex items-center justify-between border border-gray-300 rounded-lg px-4 py-1 bg-white">
                <span class="text-base text-gray-900">
                    All
                </span>

                <div class="flex items-center gap-4">
                    <button class="text-gray-400 hover:text-gray-700 transition">
                        <i class="bi bi-chevron-left text-lg"></i>
                    </button>

                    <button class="text-gray-900 hover:text-gray-700 transition">
                        <i class="bi bi-chevron-right text-lg"></i>
                    </button>
                </div>

            </div>
        </div>

        <div class="grid gap-4" [ngClass]="{
            'grid-cols-2 sm:grid-cols-3 lg:grid-cols-3': grid_col === 3,
            'grid-cols-2 sm:grid-cols-3 lg:grid-cols-4': grid_col === 4,
            'grid-cols-2 sm:grid-cols-3 lg:grid-cols-6': grid_col === 6
            }">
            @if (filteredProducts.length > 0) {
            @for (product of filteredProducts; track $index) {
            <app-product-card [product]="product" [grid_col]="grid_col">
            </app-product-card>
            }
            }@else {
            <div class="col-span-full text-center py-16 text-gray-500">
                <p class="text-lg font-medium">No products found</p>
                <p class="text-sm mt-1">
                    Try selecting a different category
                </p>
            </div>
            }
        </div>
    </div>
</section>
